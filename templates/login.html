<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Iniciar Sesión</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f1016;
            background-image:
                radial-gradient(at 0% 0%, rgba(229, 9, 20, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 101, 242, 0.15) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f5f6fa;
        }

        /* Contenedor principal de dos columnas */
        .login-card {
            display: flex;
            width: 100%;
            max-width: 850px;
            height: 520px;
            background: rgba(20, 22, 32, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(229, 9, 20, 0.1);
            overflow: hidden;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Columna Izquierda: Banner/Imagen de Streaming */
        .brand-section {
            flex: 1.1;
            position: relative;
            background: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem;
        }

        /* Degradado oscuro sobre la imagen para legibilidad del texto */
        .brand-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 16, 22, 0.2) 0%, rgba(15, 16, 22, 0.95) 100%);
        }

        .brand-content {
            position: relative;
            z-index: 2;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-description {
            color: #a0a6b8;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Columna Derecha: Formulario */
        .form-section {
            flex: 1;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 1.8rem;
        }

        .form-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        .form-header p {
            color: #727a8e;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #a0a6b8;
            font-size: 0.82rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.04);
            color: #f5f6fa;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #4a5162;
        }

        input:focus {
            outline: none;
            border-color: #e50914;
            background: rgba(229, 9, 20, 0.05);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background: #e50914;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 0.6rem;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            transition: all 0.25s ease;
        }

        button:hover {
            background: #f6121d;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.25);
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.82rem;
            color: #727a8e;
        }

        .link a {
            color: #f5f6fa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .link a:hover {
            color: #e50914;
            text-decoration: underline;
        }

        /* Responsivo para pantallas pequeñas */
        @media (max-width: 768px) {
            .login-card {
                flex-direction: column;
                height: auto;
                max-width: 400px;
                margin: 1.5rem;
            }

            .brand-section {
                height: 180px;
                padding: 1.5rem;
            }

            .form-section {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- Columna Izquierda: Imagen y Marca -->
        <div class="brand-section">
            <div class="brand-overlay"></div>
            <div class="brand-content">
                <div class="brand-logo">
                    🎬 CineStream
                </div>
                <p class="brand-description">
                    Tu plataforma de entretenimiento ilimitado. Películas, series y eventos en vivo en un solo lugar.
                </p>
            </div>
        </div>

        <!-- Columna Derecha: Formulario -->
        <div class="form-section">
            <div class="form-header">
                <h2>Iniciar sesión</h2>
                <p>Ingresa tus datos para continuar disfrutando</p>
            </div>

            {% if error %}
            <div class="alert">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST" autocomplete="off">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" required placeholder="correo@ejemplo.com" autocomplete="username">
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        autocomplete="current-password">
                </div>

                <button type="submit">Iniciar Sesión</button>
            </form>

            <div class="link">
                ¿No tienes una cuenta? <a href="/register">Crear una cuenta</a>
            </div>
        </div>
    </div>

</body>

</html>
